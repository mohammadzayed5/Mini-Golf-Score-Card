# Render's free tier spins the API down after ~15 minutes without traffic and
# takes 20-60 seconds to wake it, which is what made the app "load forever".
# Pinging /api/health every 10 minutes keeps the instance (and Turso) warm.
#
# GitHub cron can run late during busy periods, so if cold starts come back,
# an external pinger (cron-job.org / UptimeRobot, both free) is more reliable,
# and Render's paid tier removes the spin-down entirely.
name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS -m 90 -o /dev/null \
            -w 'status=%{http_code} time=%{time_total}s\n' \
            https://api.minigolfscoretracker.com/api/health
